<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Tabende</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f9fafb; color: #111827;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    @media (prefers-color-scheme: dark) { body { background: #030712; color: #f3f4f6; } }
    .card { text-align: center; max-width: 360px; }
    .icon { width: 72px; height: 72px; background: #2563eb; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 12px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>Tabende needs an internet connection. Check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
