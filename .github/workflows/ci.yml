name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Migrations apply cleanly and match schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder/placeholder
          JWT_SECRET: ci-e2e-secret
          NEXT_PUBLIC_DISABLE_SW: '1'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: |
          NODE_ENV=production node server.js &
          npx wait-on http://localhost:3000 --timeout 60000 || sleep 15
          echo "--- auth flow debug ---"
          COOKIE=$(curl -s -i -X POST http://localhost:3000/api/auth/register -H "Content-Type: application/json" -d '{"name":"Debug Probe","email":"debug-probe@example.com","password":"Probe12345!","role":"BUYER"}' | tee /tmp/reg.out | grep -io 'tab_token=[^;]*' | head -1)
          head -1 /tmp/reg.out
          echo "cookie: ${COOKIE:0:40}..."
          curl -s -o /dev/null -w "/dashboard with cookie -> %{http_code} redirect=%{redirect_url}\n" -H "Cookie: $COOKIE" http://localhost:3000/dashboard
          echo "--- end debug ---"
          npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: ci-e2e-secret
          ALLOW_INSECURE_COOKIES: '1'
          PORT: 3000
